name: Update EPG

on:
  schedule:
    - cron: '24 16 * * *'  # 00:24 (UTC+8) every day
  workflow_dispatch:       # Triggered by Cloudflare Worker (or manually)

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests lxml

      - name: Run EPG Scraper
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python e.py

      - name: Commit and Force Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # This ensures there is ALWAYS a change to commit
          date -u > last_run.txt
          
          # Add the epg and the heartbeat file
          git add e_dir/*.gz last_run.txt
          
          # Only amend if the latest commit was made by this bot;
          # otherwise create a new commit so the code commits stay intact.
          if [ "$(git log -1 --pretty=format:'%ae')" = "action@github.com" ]; then
            git commit --amend -m "Fresh Update: $(date -u)"
            git push --force
          else
            git commit -m "Fresh Update: $(date -u)"
            git push
          fi
